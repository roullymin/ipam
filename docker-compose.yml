services:
  # --- 1. 核心数据库 (MySQL 8.0) ---
  db:
    image: mysql:8.0
    container_name: ipam_db
    restart: always
    env_file: .env
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - ipam_net
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  # --- 2. 后端应用 (Django + Gunicorn) ---
  backend:
    build: ./backend
    container_name: ipam_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    env_file: .env
    volumes:
      - ./backend:/app
      - ./data/static:/app/static
      - ./data/media:/app/media
      - ./data/backups:/app/backups # <--- 关键新增：让 Django 也能读写备份目录
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - ipam_net
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  # --- 3. 反向代理网关 (Nginx) ---
  nginx:
    image: nginx:alpine
    container_name: ipam_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/static:/app/static
      - ./data/media:/app/media
      - ./certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ipam_net
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  # --- 4. 自动备份服务 (Auto Backup) ---
  backup:
    image: mysql:8.0
    container_name: ipam_backup_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data/backups:/backups
    entrypoint: |
      bash -c '
      echo "Backup service started...";
      while true; do
        current_hour=$$(date +%H)
        if [ "$$current_hour" == "03" ]; then
          echo "Starting daily backup...";
          MYSQL_PWD="$$MYSQL_PASSWORD" mysqldump -h db -u "$$MYSQL_USER" \
            --single-transaction --quick --routines --triggers "$$MYSQL_DATABASE" \
            | gzip > /backups/db_backup_$$(date +%Y%m%d_%H%M).sql.gz;
          echo "Backup created. Cleaning up old files...";
          find /backups -type f -mtime +30 -name "*.gz" -delete;
          sleep 3600; 
        fi
        sleep 1800;
      done
      '
    networks:
      - ipam_net

networks:
  ipam_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
